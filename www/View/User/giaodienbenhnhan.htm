<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/vpdt/images/favicon.png" type="image/ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="<?=_DEFAULT_LIBS_?>jquery/dist/jquery.min.js"></script>
    <link href="<?=_DEFAULT_LIBS_?>font-awesome/css/font-awesome.min.css" rel="stylesheet">

    <style>
       body {
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            height: 100vh;
            width: 100vw;
            background-color: #f0f4f8;
            overflow-x: hidden;
        }

        .container {
            width: 100vw;
            margin: auto;
            padding: 1%;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(209, 217, 230, 0.5);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .header {
            width:98vw;
            height:30vh;
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            margin-bottom: 2vh;
            overflow-x: hidden; 
        }

        .phongbenh,
        .bacsi-info,
        .thongbaoBN {
            width:33vw;
            flex: 1;
            height: 25vh;
            padding: 1%;
            border-radius: 1%;
            border: 0.2vw solid #d1d9e6;
            box-shadow: 0 0 10px rgba(209, 217, 230, 0.5);
            margin-right: 1%;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        .thongBao-container {
            height: 20vh;
            vertical-align: middle;
            justify-content: center;
            display: inline-flex;
            align-items: center;
            text-align: center;
            width: 29vw;
            /* overflow: hidden; */
        }

        .thongBao-title{
            font-size: 1.8vw;
            text-align:center; 
            height: 5vh;
        }

        .thongBao-text{
            text-shadow: 2.1px 2.1px 0 hsl(200deg 12.59% 77.58%); 
            font-weight: bold;
        }

        .bacsi-info img {
            border-radius: 50%;
            margin-bottom: 1%;
            display: block;
            margin-left: auto;
            margin-right: auto;
            object-fit: cover;
        }

        .thongbaoBN {
            font-size: 1.5vw;
            font-weight: bold;
            text-align: center;
            color: #333333;
        }

        .phongbenh h2 {
            text-align: center;
            font-size: 2vw;
            font-weight: bold;
            color: #1a73e8;
        }

        .speech-bubble {
            height: 15.6vh;
            position: relative;
            background-color: #f0f4f8;
            padding-left: 1%;
            width: 48vw;
            box-shadow: 0 0.2vw 0.4vh rgba(209, 217, 230, 0.5);
            box-sizing: border-box;
            border: 0.1vw solid #d1d9e6;
            display: flex;
            overflow: hidden;
        }

        .left-frame {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 4vw; 
            background-color: #ffffff;
            color: #333333;
            padding: 1vh 1vw;
            margin-left:-0.5vw;
            border-right: 0.1vw solid #d1d9e6;
        }

        .table-container {
            width: 97vw;
            height: 64vh;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .patient-list {
            background-color: #ffffff;
            width: 48vw;
            height: 62.5vh;
            overflow-y: auto;
            font-size: 1.8vw;
            box-sizing: border-box;
            border: 0.1vw solid #d1d9e6;
        }

        .patient-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            align-content: center;
            /* flex-wrap: wrap; */
            width: 100%;
            padding-left: 1vw;
        }

        .patient-name-container {
            display: flex;
            flex-direction: column;
            font-size: 1.5vw;
            flex-grow: 1;
        }

        .patient-details {
            font-size: 2.5vw;
            /* width: 100%;  */
            color: #000000;
            background-color: #f0f4f8;
            z-index: 2;
        }
        
        .nam-sinh-font-size {
            font-size: 2vw;
            vertical-align: middle;
        }
        .short-vertical-line {
            display: inline-block;
            width: 0.1vw; 
            height: 1.6vw; 
            background-color: black; 
            vertical-align: middle;
            margin: 0vw 0.5vw 0vw 0.5vw;
        }

        .patient-status-container {
            position: absolute;
            right: 0vw; 
            /* white-space: nowrap; */
            overflow-y: hidden;
            box-sizing: border-box;
            top: 0vw;
            z-index: 3;
    
        }

        .patient-gender-container{
            
            position: absolute;
            left: 6.5vw; 
            white-space: nowrap;
            overflow-y: scroll;
            box-sizing: border-box;
            top: 5.5vh;
            z-index: 1;
            width:10vw;
        }

        .patient-status {
            /* font-size: 2.2vw; */
            font-weight: bold;
            width:10vw;
            height: 15.6vh;
            /* white-space: wrap; */
            padding: 0.4vh 0.4vw;
            border: 0.1vw solid #d1d9e6;
            text-align: center;
            vertical-align: middle;
            justify-content: center;
            display: inline-flex;
            align-items: center;

        }

        /* .patient-status.small-font-size {
            font-size: 1.5vw;
        }

        .patient-status:not(.small-font-size) {
            font-size: 2.2vw;
        } */

        .patient-id{
            font-size:3vw;
            color: #1a73e8;
        }

        .goi {
            background-color: #1a73e8;  
            color: #ffffff;  
        }

        .trang-thai-khac {
            background-color: #ffeb3b;
            color: #333333;
        }

        .icon{
            font-size: 1.6vw;
            vertical-align: middle;
        }

        div {
            -ms-overflow-style: none; 
            scrollbar-width: none; 
            overflow-y: scroll; 
        }

        div::-webkit-scrollbar {
            display: none; 
        }

        #patient-list-2-container {
            overflow-y: hidden;
            position: relative;
            border: 0.1vw solid #d1d9e6;
        }

        #patient-list-2,
        #patient-list-2-clone {
            width: 100%;
            will-change: transform;
            top:0;
            left:0;
            height: 100%;
            overflow-y: hidden;
            
        }
        .patient-details-container {
            /* position: relative; */
            white-space: nowrap;
            overflow: hidden;
        }

        .scrolling-parent {
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            
        }   

        .scrolling-element {
            white-space: nowrap;
            overflow-y: visible;
            min-width: 30vw;
            width: fit-content;
        }   

        .scroll-primary{
            animation: scrollPrimary var(--duration) linear infinite ;
            /* animation-delay: calc(var(--duration)*-1); */
        }

        .scroll-secondary{
            animation: scrollSecondary var(--duration) linear infinite ;
            /* animation-delay: calc(var(--duration)/-2); */
        }
 
        @keyframes scrollPrimary {
            from {transform: translateX(23vw);}
            to {transform: translateX(-140%);}
        }

        /* @keyframes scrollSecondary {
            from {transform: translateX(48vw);}
            to {transform: translateX(-100%);}
        } */
     
        /* @keyframes scrollPrimary {
            from {transform: translateX(200%);}
            to {transform: translateX(0%);}
        }

        @keyframes scrollSecondary {
            from {transform: translateX(0%);}
            to {transform: translateX(-200%);}
        } */
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="phongbenh" id="phongbenhPlaceholder">
            </div>
            <div class="bacsi-info" id="bacsiPlaceholder">
                <div style="text-align: center;">
                    <!-- <img src="<?=_DEFAULT_URL_?>images/bacsi1.jpg" alt="Doctor Image" style='width:10vw; height:19vh'> -->
                </div>
            </div>            
            <div class="thongbaoBN" id="thongbaoBN"></div>
           
        </div>
        <div class="table-container">
            <div class="patient-list" id="patient-list-1"></div>
            <div class="patient-list" id="patient-list-2-container">
                <div class="patient-list" id="patient-list-2"></div>
            </div>
        </div>
    </div>
    
    <audio id="notificationSound" controls >
        <source src="<?=_DEFAULT_URL_?>/images/audio/raido.mp3" type="audio/mpeg">
    </audio>
   
    
    <input type="hidden" id="ULocal" value="/vpdt/" />
    <script src="<?=_DEFAULT_URL_?>/js/giaodien.js"></script>
    <!-- <script src="/vpdt/js/benhnhan.js"></script> -->
   
</body>
</html>
